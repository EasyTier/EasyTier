[package]
name = "easytier-ios"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
once_cell = "1.18.0"
libc = "0.2"
serde_json = "1.0"
log = "0.4"
easytier-ffi = { path = "../easytier-ffi", default-features = false, features = [
    "c-abi",
    "ffi-dataplane",
] }

[dev-dependencies]
uuid = "1"
