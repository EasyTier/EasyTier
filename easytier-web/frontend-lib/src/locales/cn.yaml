config_file: 配置文件


basic_settings: 基础设置
network: 网络配置
virtual_ipv4: 虚拟 IPv4 地址
virtual_ipv4_dhcp: 自动分配
network_name: 网络名称
network_name_label: 网络名称：
network_secret: 网络密码
initial_nodes: 初始节点
initial_nodes_help: |
  EasyTier 是去中心化工具，不区分服务端与客户端。
  · 填写此项 = 加入已有网络。
  · 留空 = 作为初始节点启动。
  · 无论直接与初始节点连接还是通过网络中的其它节点连接，都能与网络中的所有节点互联互通。
  · 可以使用公共服务器作为初始节点，也可以自行搭建。
initial_node_placeholder: 例如：node.example.com
add_initial_node: 添加初始节点


advanced_settings: 高级设置
flags_switch: 功能开关
latency_first: 延迟优先模式
latency_first_help: 忽略数据包跳数，选择总延迟最低的路径
use_smoltcp: 用户态协议栈
use_smoltcp_help: 使用用户态 TCP/IP 协议栈，规避系统防火墙导致的子网代理 / KCP 代理问题
disable_ipv6: 禁用 IPv6
disable_ipv6_help: 禁用当前节点的 IPv6 相关功能，仅使用 IPv4 进行网络通信
ipv6_public_addr_auto: 自动获取公网 IPv6
ipv6_public_addr_auto_help: 接受其它节点通告的 IPv6 路由，为当前节点分配公网 IPv6 地址
enable_kcp_proxy: KCP 代理
enable_kcp_proxy_help: 将 TCP 流量转为 KCP 流量
disable_kcp_input: 拒绝 KCP 入站
disable_kcp_input_help: 拒绝 KCP 入站流量，令其它开启 “KCP 代理” 功能的节点使用 TCP 连接到当前节点
enable_quic_proxy: QUIC 代理
enable_quic_proxy_help: 将 TCP 流量转为 QUIC 流量
disable_quic_input: 拒绝 QUIC 入站
disable_quic_input_help: 拒绝 QUIC 入站流量，令其它开启 “QUIC 代理” 功能的节点使用 TCP 连接到当前节点
disable_p2p: 禁用 P2P 打洞
disable_p2p_help: 禁用自动打洞功能，但开启 “要求 P2P 打洞” 功能的节点仍可与当前节点建立 P2P 连接
p2p_only: 仅使用 P2P
p2p_only_help: 仅与已经建立 P2P 连接的节点通信，不与 Relay 状态的节点通信
lazy_p2p: 延迟 P2P 打洞
lazy_p2p_help: 仅在数据面流量需要某个节点时才尝试与之建立 P2P 连接，但仍会主动连接开启 “要求 P2P 打洞” 的节点
bind_device: 仅使用物理网卡
bind_device_help: 仅使用物理网卡，避免通过其它虚拟网卡建立连接。
no_tun: 无 TUN 模式
no_tun_help: 不使用 TUN 虚拟网卡，主动访问其它节点需要使用 SOCKS5 代理
enable_exit_node: 作为互联网网关
enable_exit_node_help: 允许当前节点作为访问互联网的网关，转发其它节点的所有互联网流量
relay_all_peer_rpc: 转发所有 RPC 流量
relay_all_peer_rpc_help: 仅在配置 “网络白名单” 后生效，转发所有节点的 RPC 流量，即使节点所处的网络不在 “网络白名单” 中
need_p2p: 要求 P2P 打洞
need_p2p_help: 即使其它节点启用了 “禁用 P2P 打洞” 或 “延迟 P2P 打洞”，也要求它们与当前节点建立 P2P 连接
multi_thread: 多线程模式
multi_thread_help: 使用多线程运行库
proxy_forward_by_system: 系统级子网代理
proxy_forward_by_system_help: 禁用内置 NAT，调用系统内核转发子网代理流量
disable_encryption: 禁用流量加密
disable_encryption_help: 默认启用加密，如需禁用，必须在所有节点中均开启此选项
disable_tcp_hole_punching: 禁用 TCP 打洞
disable_tcp_hole_punching_help: 禁用 TCP 打洞功能
disable_udp_hole_punching: 禁用 UDP 打洞
disable_udp_hole_punching_help: 禁用 UDP 打洞功能
enable_udp_broadcast_relay: 转发 UDP 广播
enable_udp_broadcast_relay_help: 捕获物理网卡上的 UDP 广播流量并转发给其它节点，帮助局域网游戏发现房间
disable_upnp: 禁用 UPnP/NAT-PMP
disable_upnp_help: 默认启用自动端口映射，开启后禁用端口映射
disable_sym_hole_punching: 禁用端口预测
disable_sym_hole_punching_help: 针对 Symmetric NAT 禁用端口预测打洞，仅使用标准流程尝试打洞，失败后退回 Relay 状态
enable_magic_dns: 魔法 DNS
enable_magic_dns_help: 允许通过 EasyTier 的 DNS 服务器访问其它节点的虚拟 IPv4 地址，例如 node1.et.net
enable_private_mode: 私有网络模式
enable_private_mode_help: 类似网络白名单，不允许网络名称和密码与当前节点不同的的节点将当前节点作为初始节点，如需启用，必须在所有节点中均开启此选项
hostname: 主机名
hostname_placeholder: 留空默认为主机名：{0}
proxy_cidrs: 子网代理 CIDR
enable_vpn_portal: VPN Portal
vpn_portal_wireguard_listen: WireGuard 监听地址
vpn_portal_wireguard_listen_placeholder: 例如：0.0.0.0:22022
vpn_portal_wireguard_private_key: WireGuard 服务端私钥
vpn_portal_wireguard_private_key_placeholder: 必填 Base64 密钥（可用 wg genkey 生成）
vpn_portal_clients: WireGuard 客户端
vpn_portal_add_client: 添加客户端
vpn_portal_no_clients: 尚未配置客户端
vpn_portal_client_name: 客户端名称
vpn_portal_client_name_placeholder: 例如：alice-phone
vpn_portal_client_virtual_ip: 虚拟网地址
vpn_portal_client_virtual_ip_placeholder: 例如：10.126.126.10
vpn_portal_client_groups: ACL 组
vpn_portal_client_groups_placeholder: 选择 ACL 组
vpn_portal_remove_client: 删除客户端
listener_urls: 监听地址
add_listener_url: 添加监听地址
dev_name: TUN 网卡名称
dev_name_placeholder: 留空以自动生成随机名称。请为不同网络设置不同的 TUN 名称以避免 IP 冲突
mtu: MTU
mtu_help: TUN 虚拟网卡的数据包最大传输单元，范围：400-1380，非加密时默认为 1380，加密时默认为 1360
mtu_placeholder: 留空为默认值
instance_recv_bps_limit: 限制入站速率
instance_recv_bps_limit_help: 限制当前节点总入站流量的接收速率，单位 Byte/s
instance_recv_bps_limit_placeholder: 留空表示不限速
relay_network_whitelist: 网络白名单
relay_network_whitelist_help: |
  仅允许白名单网络中的节点将当前节点作为初始节点，若参数为空，则允许所有网络将当前节点作为初始节点
  支持通配符字符串，输入完成后在下拉框中点选才能生效，如需连续输入多个网络名称，应使用英文空格间隔，例如：
  * 表示所有网络；
  def* 表示以 def 为前缀的网络；
  net1 net2 表示 net1 和 net2 两个网络
manual_routes: 自定义路由
manual_routes_help: 当前节点将忽略其他节点共享的完整子网路由，仅使用指定的路由条目，当前节点自身通过 “子网代理 CIDR” 共享的路由仍会正常广播给其他节点
socks5: SOCKS5 服务器
socks5_help: 启用 SOCKS5 服务器，允许 SOCKS5 客户端访问虚拟网络，需填写将要开放的服务器端口
exit_nodes: 互联网网关
exit_nodes_help: 填写开启 “作为互联网网关” 功能的虚拟 IPv4 地址，优先级由列表顺序决定
mapped_listeners: 监听映射
mapped_listeners_help: 在复杂网络环境中手动指定监听器的公网地址，便于其它节点连接到当前节点
add_mapped_listener: 添加监听映射


port_forwards: 端口转发
port_forwards_help: |
  · 将访问当前节点所在主机指定端口的流量，通过当前节点转发至目标 IPv4 地址的指定端口，即：访问本机端口 = 访问远端服务，这一过程可以不经过虚拟网络。
  · 假设本机物理 IPv4 地址为 192.168.1.2，虚拟 IPv4 地址为 10.126.126.5。
  · 使用案例如下：
  · tcp://0.0.0.0:80/10.126.126.1:8080 表示将访问当前节点所在主机 80 端口的 TCP 流量，通过节点转发到设备 IPv4 地址为 10.126.126.1，端口为 8080 的 TCP 服务；
  · udp://0.0.0.0:12345/192.168.1.100:23456 表示将访问当前节点所在主机 12345 端口的 UDP 流量，通过节点转发到设备 IPv4 地址为 192.168.1.100，端口为 23456 的 UDP 服务；
  · tcp://10.126.126.2:11211/192.168.1.100:11211 该路径不通，“监听地址” 必须为本机。
port_forwards_bind_addr: 监听地址，如：0.0.0.0
port_forwards_dst_addr: 目标地址，如：10.126.126.1
port_forwards_add_btn: 添加
edit_port_forward: 编辑转发规则


