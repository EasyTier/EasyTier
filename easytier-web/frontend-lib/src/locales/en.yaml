basic_settings: Basic Settings
network: Network Config
virtual_ipv4: Virtual IPv4
virtual_ipv4_dhcp: DHCP
network_name: Network Name
network_name_label: "Network Name: "
network_secret: Network Secret
initial_nodes: Initial Nodes
initial_nodes_help: |
  EasyTier is a decentralized tool and does not distinguish between server and client roles.
  • Fill in this field = join an existing network.
  • Leave empty = start as an initial node.
  • Whether you connect directly to initial nodes or through other nodes in the network, you can communicate with all nodes in the network.
  • You can use public servers as initial nodes, or set up your own.
initial_node_placeholder: "Example: node.example.com"
add_initial_node: Add Initial Node


advanced_settings: Advanced Settings
flags_switch: Feature Switch
latency_first: Latency-First Mode
latency_first_help: Ignore packet hop count and select the path with the lowest total latency
use_smoltcp: User-Space Protocol Stack
use_smoltcp_help: Use a user-space TCP/IP stack to avoid system firewall blocking subnet proxy / KCP proxy
disable_ipv6: Disable IPv6
disable_ipv6_help: Disable IPv6 functionality for this node, use IPv4 only
ipv6_public_addr_auto: Auto Public IPv6
ipv6_public_addr_auto_help: Accept IPv6 routes advertised by other nodes to assign a public IPv6 address to this node
enable_kcp_proxy: KCP Proxy
enable_kcp_proxy_help: Convert TCP traffic to KCP traffic
disable_kcp_input: Reject KCP Inbound
disable_kcp_input_help: Reject inbound KCP traffic; nodes with KCP proxy enabled will connect via TCP instead
enable_quic_proxy: QUIC Proxy
enable_quic_proxy_help: Convert TCP traffic to QUIC traffic
disable_quic_input: Reject QUIC Inbound
disable_quic_input_help: Reject inbound QUIC traffic; nodes with QUIC proxy enabled will connect via TCP instead
disable_p2p: Disable P2P Hole Punching
disable_p2p_help: Disable automatic hole punching, but nodes with "Need P2P" enabled can still establish P2P with this node
p2p_only: P2P Only
p2p_only_help: Only communicate with peers that have established P2P connections; do not communicate via relay
lazy_p2p: Lazy P2P Hole Punching
lazy_p2p_help: Only attempt P2P hole punching when data traffic requires a specific peer; still proactively connect to nodes with "Need P2P" enabled
bind_device: Physical Device Only
bind_device_help: Use only the physical network interface, prevent connections via virtual network interfaces
no_tun: No TUN Mode
no_tun_help: Do not use a TUN virtual interface; accessing other nodes requires SOCKS5 proxy
enable_exit_node: Internet Gateway
enable_exit_node_help: Allow this node to act as an internet gateway, forwarding all internet traffic from other nodes
relay_all_peer_rpc: Relay All RPC Traffic
relay_all_peer_rpc_help: Only effective when "Network Whitelist" is configured; relay RPC traffic for all nodes even if their network is not in the whitelist
need_p2p: Need P2P
need_p2p_help: Require other nodes to establish P2P connections with this node even if they have "Disable P2P Hole Punching" or "Lazy P2P Hole Punching" enabled
multi_thread: Multi-threaded Mode
multi_thread_help: Use multi-threaded runtime
proxy_forward_by_system: System-Level Subnet Proxy
proxy_forward_by_system_help: Disable built-in NAT, delegate subnet proxy forwarding to the system kernel
disable_encryption: Disable Traffic Encryption
disable_encryption_help: Encryption is enabled by default; to disable, this option must be enabled on all nodes
disable_tcp_hole_punching: Disable TCP Hole Punching
disable_tcp_hole_punching_help: Disable TCP hole punching
disable_udp_hole_punching: Disable UDP Hole Punching
disable_udp_hole_punching_help: Disable UDP hole punching
enable_udp_broadcast_relay: Forward UDP Broadcast
enable_udp_broadcast_relay_help: Capture UDP broadcast traffic from physical interfaces and forward it to other nodes, helping LAN games discover rooms
disable_upnp: Disable UPnP/NAT-PMP
disable_upnp_help: Automatic port mapping is enabled by default; enable this to disable port mapping
disable_sym_hole_punching: Disable Port Prediction
disable_sym_hole_punching_help: Disable port prediction for symmetric NAT; only attempt standard hole punching and fall back to relay on failure
enable_magic_dns: Magic DNS
enable_magic_dns_help: Allow accessing other nodes' virtual IPv4 addresses via EasyTier's DNS server, e.g. node1.et.net
enable_private_mode: Private Network Mode
enable_private_mode_help: Similar to a network whitelist; prevents nodes with different network names or passwords from using this node as an initial node. Must be enabled on all nodes
hostname: Hostname
hostname_placeholder: 'Leave blank to default to hostname: {0}'
proxy_cidrs: Subnet Proxy CIDRs
enable_vpn_portal: VPN Portal
vpn_portal_wireguard_listen: WireGuard Listen Address
vpn_portal_wireguard_listen_placeholder: "Example: 0.0.0.0:22022"
vpn_portal_wireguard_private_key: WireGuard Server Private Key
vpn_portal_wireguard_private_key_placeholder: Required base64 key (generate with wg genkey)
vpn_portal_clients: WireGuard Clients
vpn_portal_add_client: Add Client
vpn_portal_no_clients: No clients configured
vpn_portal_client_name: Client Name
vpn_portal_client_name_placeholder: "Example: alice-phone"
vpn_portal_client_virtual_ip: Virtual Network Address
vpn_portal_client_virtual_ip_placeholder: "Example: 10.126.126.10"
vpn_portal_client_groups: ACL Groups
vpn_portal_client_groups_placeholder: Select ACL groups
vpn_portal_remove_client: Remove Client
listener_urls: Listener URLs
add_listener_url: Add Listener
dev_name: TUN Interface Name
dev_name_placeholder: Leave blank to auto-generate a random name. Use different TUN names for different networks to avoid IP assignment conflicts
mtu: MTU
mtu_help: "Maximum Transmission Unit for the TUN virtual interface, range: 400-1380, defaults to 1380 (non-encrypted) or 1360 (encrypted)"
mtu_placeholder: Leave blank for default
instance_recv_bps_limit: Inbound Rate Limit
instance_recv_bps_limit_help: "Limit the total inbound traffic rate for this node, unit: Byte/s"
instance_recv_bps_limit_placeholder: Leave blank for no limit
relay_network_whitelist: Network Whitelist
relay_network_whitelist_help: |
  Only allow nodes from whitelisted networks to use this node as an initial node. If empty, all networks are allowed.
  Supports wildcard strings. Select from the dropdown after input to confirm. Use spaces to separate multiple network names, e.g.:
  * means all networks;
  def* means networks starting with "def";
  net1 net2 means only net1 and net2
manual_routes: Manual Routes
manual_routes_help: This node will ignore full subnet routes shared by other nodes and only use the specified routes. Routes shared by this node via "Subnet Proxy CIDRs" are still broadcast normally
socks5: SOCKS5 Server
socks5_help: Enable SOCKS5 server to allow SOCKS5 clients to access the virtual network. Specify the server port to open
exit_nodes: Internet Gateways
exit_nodes_help: Virtual IPv4 addresses of nodes with "Internet Gateway" enabled. Priority is determined by list order
mapped_listeners: Mapped Listeners
mapped_listeners_help: Manually specify the public address of listeners in complex network environments, allowing other nodes to connect to this node
add_mapped_listener: Add Mapped Listener


port_forwards: Port Forwards
port_forwards_help: |
  · Forward traffic accessing a specified port on this node's host to a target IPv4 address and port via this node. Accessing a local port = accessing a remote service, without going through the virtual network.
  · Suppose the host's physical IPv4 address is 192.168.1.2 and the virtual IPv4 address is 10.126.126.5.
  · Usage examples:
  · tcp://0.0.0.0:80/10.126.126.1:8080 means forwarding TCP traffic from port 80 on this node's host to the device at IPv4 10.126.126.1, port 8080;
  · udp://0.0.0.0:12345/192.168.1.100:23456 means forwarding UDP traffic from port 12345 on this node's host to the device at IPv4 192.168.1.100, port 23456;
  · tcp://10.126.126.2:11211/192.168.1.100:11211 will not work because the "Listen address" must be on this node's host.
port_forwards_bind_addr: "Listen address, e.g.: 0.0.0.0"
port_forwards_dst_addr: "Target address, e.g.: 10.126.126.1"
port_forwards_add_btn: "Add"
edit_port_forward: "Edit Forward Rule"


