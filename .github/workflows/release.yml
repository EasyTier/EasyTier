name: EasyTier Release

on:
  workflow_dispatch:
    inputs:
      core_run_id:
        description: 'Run ID of EasyTier Core or a successful EasyTier Nightly'
        type: number
        required: true
      gui_run_id:
        description: 'Run ID of EasyTier GUI (use the same ID for Nightly)'
        type: number
        required: true
      mobile_run_id:
        description: 'Run ID of EasyTier Mobile (use the same ID for Nightly)'
        type: number
        required: true
      version:
        description: 'Version for this release'
        type: string
        default: 'v2.7.0'
        required: true
      make_latest:
        description: 'Mark this release as latest'
        type: boolean
        default: true
        required: true

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v5

      - name: Validate complete builds
        uses: actions/github-script@v8
        env:
          CORE_RUN_ID: ${{ inputs.core_run_id }}
          GUI_RUN_ID: ${{ inputs.gui_run_id }}
          MOBILE_RUN_ID: ${{ inputs.mobile_run_id }}
        with:
          script: |
            const validate = require('./.github/scripts/validate-release-builds.js');
            await validate({ github, context, core });

      - name: Download Core Artifact
        uses: dawidd6/action-download-artifact@v11
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          run_id: ${{ inputs.core_run_id }}
          name: '^(easytier-(?!gui-|mobile-)[\w.-]+|Easytier-Magisk)$'
          name_is_regexp: true
          repo: ${{ github.repository }}
          path: release_assets

      - name: Download GUI Artifact
        uses: dawidd6/action-download-artifact@v11
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          run_id: ${{ inputs.gui_run_id }}
          name: '^easytier-gui-[\w.-]+$'
          name_is_regexp: true
          repo: ${{ github.repository }}
          path: release_assets_nozip

      - name: Download Mobile Artifact
        uses: dawidd6/action-download-artifact@v11
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          run_id: ${{ inputs.mobile_run_id }}
          name: '^easytier-mobile-[\w.-]+$'
          name_is_regexp: true
          repo: ${{ github.repository }}
          path: release_assets_nozip

      - name: Zip release assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir zipped_assets

          find release_assets_nozip -type f -exec mv {} zipped_assets \;
          ls -l -R ./zipped_assets

          cd release_assets
          ls -l -R ./
          chmod -R 755 .
          for x in `ls`; do
            if [ "$x" = "Easytier-Magisk" ]; then
              # for Easytier-Magisk, make sure files are in the root of the zip
              cd $x;
              zip -r ../../zipped_assets/$x-${VERSION}.zip .;
              cd ..;
            else
              zip -r ../zipped_assets/$x-${VERSION}.zip $x;
            fi
          done

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ inputs.version }}
          draft: true
          files: |
            ./zipped_assets/*
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.version }}
