name: Update Npcap dependencies

on:
  workflow_dispatch:
    inputs:
      npcap-version:
        description: 'Npcap installer version (e.g. 1.90 or latest)'
        required: true
        type: string
        default: '1.90'
      sdk-version:
        description: 'Npcap SDK version (e.g. 1.17 or latest)'
        required: true
        type: string
        default: '1.17'

permissions:
  contents: write

concurrency:
  group: update-npcap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y 7zip

      - name: Refresh Npcap DLLs and import libraries
        env:
          NPCAP_VERSION: ${{ inputs['npcap-version'] }}
          SDK_VERSION: ${{ inputs['sdk-version'] }}
        run: python3 .github/scripts/update-npcap.py "$NPCAP_VERSION" "$SDK_VERSION"

      - name: Commit updated dependencies
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- easytier/third_party/
          if git diff --cached --quiet; then
            echo 'Npcap files are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(deps): update Npcap binaries and import libraries'
          git push origin "HEAD:${GITHUB_REF_NAME}"
