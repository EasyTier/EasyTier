syntax = "proto3";

package easytier;

import "google/protobuf/descriptor.proto";

message ApiSpelling {
  string field = 1;
  bool negate = 2;
}

message FlagMeta {
  // JSON spelling of the flag's default value. Defaults that parse as text
  // are strings in JSON.
  optional string default = 1;
  ApiSpelling api = 2;
  bool form = 3;
  bool deprecated = 4;
  // Rust attributes forwarded to the generated Flags field.
  repeated string attributes = 5;
  // Alternate input names for this flag, including legacy spellings.
  repeated string alias = 6;
}

extend google.protobuf.FieldOptions {
  FlagMeta flag = 50001;
}
