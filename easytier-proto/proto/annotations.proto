syntax = "proto3";

package easytier;

import "google/protobuf/descriptor.proto";

// The name the management API spells a flag with, where it differs from the
// flag's own, and whether that field is the flag's negation.
message ApiSpelling {
  string field = 1;
  bool negate = 2;
}

// What a flag is worth and how the layers around it name it.
//
// `default` holds the value the core runs for a flag a configuration does not
// state, written the way the flag's own type reads; an `optional` flag leaves
// it out, which is what "unset" means. A form has a non-boolean control for
// `form`; boolean flags need no marker, since the type says so.
message FlagMeta {
  // JSON spelling of the flag's default value. Defaults that parse as text
  // are strings in JSON.
  optional string default = 1;
  ApiSpelling api = 2;
  bool form = 3;
  bool deprecated = 4;
  // Rust attributes forwarded to the generated Flags field.
  repeated string attributes = 5;
  // Alternate input names for this field. They need not name protobuf fields;
  // each alias and its camelCase spelling refer to this field.
  repeated string alias = 6;
}

extend google.protobuf.FieldOptions {
  FlagMeta flag = 50001;
}
