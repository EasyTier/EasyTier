syntax = "proto3";

import "common.proto";

package core_config;

message CoreConfig {
  NodeConfig node = 1;
  RouteConfig routes = 2;
  PeerPolicyConfig peer_policy = 3;
  TrafficConfig traffic = 4;
}

message NodeConfig {
  optional uint32 peer_id = 1;
  optional common.UUID instance_id = 2;
  optional string hostname = 3;
  string network_name = 4;
}

message RouteConfig {
  optional IpPrefix ipv4 = 1;
  optional IpPrefix ipv6 = 2;
  repeated IpPrefix advertised_routes = 3;
  repeated ProxyNetworkConfig proxy_networks = 4;
  repeated ForeignNetworkConfig foreign_networks = 5;
}

message IpPrefix {
  common.IpAddr address = 1;
  uint32 prefix_len = 2;
}

message ProxyNetworkConfig {
  IpPrefix real = 1;
  optional IpPrefix mapped = 2;
}

message ForeignNetworkConfig {
  string name = 1;
  repeated IpPrefix cidrs = 2;
}

message PeerPolicyConfig {
  optional bool p2p_enabled = 1;
  optional bool relay_peer_rpc = 2;
  optional bool relay_data = 3;
  optional bool latency_first = 4;
  optional bool encryption_required = 5;
}

message TrafficConfig {
  optional uint32 mtu = 1;
  optional uint64 instance_recv_bps_limit = 2;
  optional uint64 foreign_relay_bps_limit = 3;
}

// Raw file/management input. Domain parsing and defaults belong to Raw -> Parsed.
// Future generators may rename these messages, preserving field numbers, types
// and collection wrapper nesting.
message DnsConfigRaw {
  RepeatedDnsZoneConfigRaw zone = 1;
  optional string domain = 2;
}

message RepeatedDnsZoneConfigRaw { repeated DnsZoneConfigRaw items = 1; }

message DnsZoneConfigRaw {
  string origin = 1;
  optional uint32 ttl = 2;
  RepeatedDnsRecordRaw records = 3;
}

message RepeatedDnsRecordRaw { repeated DnsRecordRaw items = 1; }

// The values are DNS RR type codes, restricted to the supported input types.
enum DnsRecordType {
  DNS_RECORD_TYPE_UNSPECIFIED = 0;
  A = 1;
  NS = 2;
  CNAME = 5;
  SOA = 6;
  PTR = 12;
  HINFO = 13;
  MX = 15;
  TXT = 16;
  AAAA = 28;
  SRV = 33;
  NAPTR = 35;
  CERT = 37;
  SSHFP = 44;
  TLSA = 52;
  CSYNC = 62;
  SVCB = 64;
  HTTPS = 65;
  OPENPGPKEY = 61;
  CAA = 257;
  ANAME = 65305;
}

message DnsRecordRaw {
  string name = 1;
  DnsRecordType type = 2;
  optional uint32 ttl = 3;
  // One RDATA in presentation format, without an owner, TTL, class or type.
  optional string value = 4;
  reserved 5;
  reserved "txt";
}
