[workspace]
resolver = "2"
members = [
    "easytier-core",
    "easytier-proto",
    "easytier",
    "easytier-gui/src-tauri",
    "easytier-web",
    "easytier-contrib/easytier-mini",
    "easytier-contrib/easytier-ffi",
    "easytier-contrib/easytier-uptime",
    "easytier-contrib/easytier-android-jni",
    "easytier-contrib/easytier-ios",
]
default-members = ["easytier", "easytier-web"]
exclude = [
    "easytier-contrib/easytier-ohrs", # it needs ohrs sdk
]

[workspace.package]
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
# Shared versions and sources; members select features and optional dependencies.
anyhow = "1.0"
arc-swap = "1.7"
async-trait = "0.1.89"
atomic-shim = "0.2.0"
auto_impl = "1.1.0"
base64 = "0.22"
bon = "3.9.1"
bytecodec = "0.4.15"
bytes = "1.5.0"
chrono = "0.4.37"
cidr = "0.3.1"
clap = "4.5.30"
crossbeam = "0.8.4"
dashmap = "6.1.0"
easytier = { version = "2.7.0", path = "easytier", default-features = false }
easytier-core = { version = "2.7.0", path = "easytier-core", default-features = false }
easytier-ffi = { path = "easytier-contrib/easytier-ffi", default-features = false }
easytier-proto = { version = "2.7.0", path = "easytier-proto", default-features = false }
futures = "0.3"
guarden = "0.2"
hmac = "0.12.1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false }
indoc = "2.0.7"
log = "0.4"
mimalloc = "*"
once_cell = "1.19"
parking_lot = "0.12.1"
percent-encoding = "2.3.1"
pin-project-lite = "0.2.13"
prost = "0.14.3"
prost-types = "0.14.3"
quanta = "0.12"
rand = "0.8.5"
reqwest = { version = "0.12.12", default-features = false }
rust-i18n = "3"
rustls = { version = "0.23.0", default-features = false }
sea-orm = "1.1"
sea-orm-migration = "1.1"
serde = "1.0.220"
serde_json = "1.0"
sha2 = "0.10.8"
smoltcp = { version = "0.13.1", default-features = false }
sqlx = "0.8"
strum = "0.27.2"
stun_codec = "0.3.4"
sys-locale = "0.3"
tauri = "2.7.0"
tempfile = "3.22.0"
thiserror = "1.0"
thunk-rs = { git = "https://github.com/EasyTier/thunk.git", default-features = false }
tokio = { version = "1.0", default-features = false }
tokio-rustls = { version = "0.26", default-features = false }
tokio-util = "0.7.9"
toml = "0.8.12"
tower-http = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false }
url = "2.5"
uuid = "1.17.0"
winapi = "0.3.9"
x25519-dalek = "2.0"
zerocopy = "0.7.32"

[profile.dev]
panic = "unwind"
debug = 2

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
strip = true

[profile.mini]
inherits = "release"
opt-level = "z"
strip = "symbols"
